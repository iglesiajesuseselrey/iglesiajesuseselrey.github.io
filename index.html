<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Iglesia Jesús es el Rey</title>
<meta name="description" content="Iglesia Jesús es el Rey · Pasión por su Presencia. Cultos en vivo, eventos, noticias, Biblia y peticiones de oración.">
<meta name="theme-color" content="#110c5c">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jesús es el Rey">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Allura&family=Archivo:wght@700;800;900&family=Nunito+Sans:ital,opsz,wght@0,6..12,400;0,6..12,600;0,6..12,700;0,6..12,800;1,6..12,400&display=swap">
<style>
:root{
  --bg:#f4f3fc; --surface:#ffffff; --ink:#18144a; --muted:#5a5784; --line:#dfdcf3;
  --accent:#3524c4; --accent-ink:#ffffff; --soft:#e7e4ff;
  --hero1:#110c5c; --hero2:#2c20c4; --on-hero:#ffffff;
  --ok:#2f7a55; --live:#d23b3b; --danger:#b3261e; --shade:rgba(16,12,60,.55);
  --font-display:"Archivo","Arial Black","Helvetica Neue",Arial,sans-serif;
  --font-script:"Allura","Brush Script MT",cursive;
  --font-body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0e0b2c; --surface:#18144a; --ink:#eeedff; --muted:#aca8d8; --line:#2e2868;
  --accent:#aaa0ff; --accent-ink:#110c3a; --soft:#2c2570;
  --hero1:#0b0840; --hero2:#2419a8;
  --ok:#6fcf9d; --live:#ff6b6b; --danger:#ffb4ab; --shade:rgba(0,0,0,.7); color-scheme:dark;
}}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:70px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.6;padding-bottom:env(safe-area-inset-bottom,0px)}
body.locked{overflow:hidden}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:var(--accent)}
button{font:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.hero{background:radial-gradient(ellipse at 50% 0%,var(--hero2) 0%,var(--hero1) 75%);color:var(--on-hero);padding-top:env(safe-area-inset-top,0px)}
.hero .wrap{padding-block:36px 30px;text-align:center;display:grid;justify-items:center}
.logo{width:min(250px,64vw);height:auto;display:block;margin-bottom:16px}
h1{font-family:var(--font-display);font-weight:900;text-transform:uppercase;font-size:clamp(28px,6.2vw,52px);line-height:1.05;margin:0;text-wrap:balance}
.tagline{font-family:var(--font-script);font-size:clamp(34px,6vw,50px);line-height:1.1;margin:4px 0 0}

.cinta{background:var(--hero1);color:var(--on-hero);border-top:1px solid rgba(255,255,255,.12)}
.cinta .wrap{padding-block:18px 22px;text-align:center;display:grid;gap:4px;justify-items:center;min-height:110px;align-content:center}
.cinta q{quotes:"“" "”";font-style:italic;font-size:clamp(16px,2.6vw,19px);line-height:1.5;max-width:46ch;text-wrap:balance;transition:opacity .35s}
.cinta small{font-size:12.5px;letter-spacing:.08em;opacity:.75;font-weight:700;text-transform:uppercase;transition:opacity .35s}
.cinta.swap q,.cinta.swap small{opacity:0}

.nav{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.nav .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-block:8px}
.nav .wrap::-webkit-scrollbar{display:none}
.nav a,.nav button{flex:none;text-decoration:none;color:var(--muted);font-weight:700;font-size:14px;padding:7px 14px;border-radius:999px;white-space:nowrap;border:0;background:transparent;cursor:pointer}
.nav a:hover,.nav button:hover{background:var(--bg);color:var(--ink)}
.nav a.live{color:var(--live)}
.nav button{color:var(--accent)}

main{padding-block:28px 64px;display:grid;gap:52px}
section{display:grid;gap:18px;min-width:0}
h2{font-family:var(--font-display);font-weight:800;font-size:clamp(28px,4.6vw,36px);line-height:1.1;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:2px 0 0;font-size:15px}
.empty{border:1px dashed var(--line);border-radius:14px;padding:24px;text-align:center;color:var(--muted);background:var(--surface)}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:560px){.tiles{grid-template-columns:1fr}}
.tile{display:grid;grid-template-columns:48px 1fr auto;gap:14px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;cursor:pointer;color:var(--ink)}
.tile:hover{border-color:var(--accent)}
.tile .ic{width:48px;height:48px;border-radius:12px;background:radial-gradient(ellipse at 50% 0%,var(--hero2),var(--hero1));display:grid;place-items:center}
.tile .ic svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tile b{display:block;font-size:16px;font-weight:800}
.tile .t2{display:block;font-size:13px;color:var(--muted)}
.tile .arr{color:var(--muted);font-size:22px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;border:0;border-radius:12px;padding:12px 18px;cursor:pointer;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-size:15px}
.btn:disabled{opacity:.55;cursor:default}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.small{padding:7px 12px;font-size:13px;border-radius:10px}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line)}
.btn.live{background:var(--live);color:#fff}
.btn.block{width:100%}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;display:grid;gap:12px;align-content:start;min-width:0}
.ccard h3{margin:0;font-size:19px;font-weight:800}
.ccard p{margin:0;color:var(--muted)}
.ccard.on{border-color:var(--live);box-shadow:0 0 0 3px color-mix(in srgb,var(--live) 15%,transparent)}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;border-radius:999px;padding:3px 10px;width:max-content}
.pill.on{background:var(--live);color:#fff}
.pill.off{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
.kv{display:grid;gap:6px}
.kv div{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bg);border-radius:10px;padding:8px 12px;font-size:14px}
.kv span{color:var(--muted)}
.kv b{font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.copy{border:0;background:transparent;color:var(--accent);font-weight:700;font-size:13px;cursor:pointer}

.events{display:grid;gap:12px}
.ev{display:grid;grid-template-columns:72px 1fr auto;gap:16px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.ev .date{text-align:center;border-radius:12px;background:var(--soft);padding:8px 4px;line-height:1.05}
.ev .m{display:block;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.ev .d{display:block;font-family:var(--font-display);font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
.ev .w{display:block;font-size:12px;color:var(--muted)}
.ev h3{margin:0 0 2px;font-size:18px;font-weight:800}
.ev .info{color:var(--muted);font-size:14px;display:flex;flex-wrap:wrap;gap:4px 14px}
.ev p{margin:6px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.ev .body{min-width:0}
@media (max-width:520px){.ev{grid-template-columns:60px 1fr}.ev .tools{grid-column:1/-1}}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.post{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:grid;align-content:start;min-width:0}
.gallery{display:grid;gap:3px;grid-template-columns:repeat(2,1fr);background:var(--line)}
.gallery.n1{grid-template-columns:1fr}
.gallery button{border:0;padding:0;cursor:zoom-in;background:var(--bg);aspect-ratio:4/3;overflow:hidden;position:relative}
.gallery.n1 button{aspect-ratio:16/10}
.gallery img{width:100%;height:100%;object-fit:cover;display:block}
.gallery .more{position:absolute;inset:0;display:grid;place-items:center;background:var(--shade);color:#fff;font-weight:800;font-size:22px}
.post .txt{padding:16px 18px 18px;display:grid;gap:6px}
.post time,.src{font-size:13px;color:var(--muted);font-weight:700}
.post h3{margin:0;font-family:var(--font-display);font-size:21px;line-height:1.2;font-weight:800}
.post p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.poster{aspect-ratio:16/9;display:grid;place-items:center;text-decoration:none;color:#fff;background:radial-gradient(ellipse at 50% 0%,var(--hero2),var(--hero1))}
.play{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;margin:0 auto}
.poster small{display:block;margin-top:8px;font-weight:700;text-align:center}
.tools{display:flex;gap:8px;flex-wrap:wrap}

.drawer-bg{position:fixed;inset:0;z-index:40;background:var(--shade);opacity:0;transition:opacity .25s}
.drawer-bg.open{opacity:1}
.drawer{position:fixed;top:0;left:0;bottom:0;z-index:41;width:min(560px,100%);background:var(--bg);box-shadow:16px 0 40px -20px var(--shade);display:grid;grid-template-rows:auto 1fr;transform:translateX(-100%);transition:transform .28s ease}
.drawer.menu{width:min(340px,88%)}
.drawer.open{transform:none}
.drawer header{background:radial-gradient(ellipse at 50% 0%,var(--hero2),var(--hero1));color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 14px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px}
.drawer header h2{font-size:21px;flex:1;color:#fff;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drawer header button{flex:none}
.drawer header button{border:0;background:rgba(255,255,255,.15);color:#fff;border-radius:999px;padding:8px 14px;font-weight:800;cursor:pointer;white-space:nowrap}
.drawer .body{overflow:auto;padding:18px 16px calc(28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:16px;align-content:start;overscroll-behavior:contain}
.menulist{display:grid;gap:8px}
.menulist button,.menulist a{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;color:var(--ink);text-decoration:none;font:inherit}
.menulist button:hover,.menulist a:hover{border-color:var(--accent)}
.menulist .ic{width:44px;height:44px;border-radius:12px;background:radial-gradient(ellipse at 50% 0%,var(--hero2),var(--hero1));display:grid;place-items:center}
.menulist .ic svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.menulist b{display:block;font-size:16px;font-weight:800}
.menulist small{display:block;font-size:13px;color:var(--muted)}
.menulist .arr{color:var(--muted);font-size:22px}
.menubtn{display:inline-flex!important;align-items:center;gap:8px;background:var(--accent)!important;color:var(--accent-ink)!important}
.menubtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round}

/* Eventos plegables */
details.ev{display:block;padding:0}
details.ev summary{list-style:none;display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;padding:12px 14px;cursor:pointer}
details.ev summary::-webkit-details-marker{display:none}
details.ev .date{padding:6px 4px}
details.ev .d{font-size:26px}
details.ev summary h3{margin:0;font-size:17px}
.date.semanal .dd{font-size:20px!important;letter-spacing:.02em;padding:2px 0}
.date.semanal .m,.date.semanal .w{font-size:10.5px}
details.ev .chev{color:var(--muted);font-size:20px;transition:transform .2s}
details.ev[open] .chev{transform:rotate(90deg)}
details.ev .more{padding:0 16px 16px 92px;display:grid;gap:6px}
@media (max-width:520px){details.ev .more{padding-left:16px}}

/* Botón flotante de redes */
.redes{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:35;display:grid;justify-items:end;gap:12px}
body:has(#install) .redes{bottom:calc(170px + env(safe-area-inset-bottom,0px))}
body.locked .redes{display:none}
.redes-btn{width:60px;height:60px;border-radius:50%;border:0;cursor:pointer;background:radial-gradient(ellipse at 50% 0%,var(--hero2),var(--hero1));box-shadow:0 10px 26px -8px var(--shade),0 0 0 3px rgba(255,255,255,.9);display:grid;place-items:center}
.redes-btn svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round}
.redes-btn .ab circle{fill:#fff}
.redes .ce{display:none}.redes.abierto .ce{display:block}.redes.abierto .ab{display:none}
.redes-lista{display:grid;gap:10px;justify-items:end;animation:up .2s ease-out}
.red{display:flex;align-items:center;gap:10px;text-decoration:none}
.red-txt{background:var(--surface);color:var(--ink);font-weight:800;font-size:14px;padding:6px 12px;border-radius:999px;box-shadow:0 6px 16px -8px var(--shade)}
.red-ic{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;box-shadow:0 8px 20px -8px var(--shade)}
.red-ic svg{width:26px;height:26px}
/* Botones de evento */
.evtools{margin-top:6px}
.btn.wa{background:#1f9d55;color:#fff}
/* Imagen de evento */
.evimg{display:block;width:100%;max-height:420px;object-fit:cover;border-radius:12px;background:var(--bg);margin-bottom:4px}
/* Agradecimientos, encuestas */
.gracias-lista{display:grid;gap:10px}
.gcard{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer}
.gcard input{width:20px;height:20px;accent-color:var(--accent)}
.gcard b{display:block;font-size:16px;overflow-wrap:anywhere}
.gcard small{color:var(--muted)}
.opciones{display:grid;gap:8px}
.opcion{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;background:var(--surface)}
.opcion input{width:20px;height:20px;accent-color:var(--accent)}
.opcion:has(input:checked){border-color:var(--accent);background:var(--soft);font-weight:700}
.barra{display:grid;gap:6px}
.barra-t{display:flex;justify-content:space-between;gap:10px;font-size:15px}
.barra-t b{font-variant-numeric:tabular-nums}
.barra-f{height:12px;border-radius:999px;background:var(--bg);overflow:hidden}
.barra-f i{display:block;height:100%;background:var(--accent);border-radius:999px}
/* SINPE */
.sinpe{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px}
@media (max-width:520px){.sinpe{grid-template-columns:1fr}}
.sinpe .num{font-family:var(--font-display);font-size:clamp(28px,7vw,36px);font-weight:800;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.sinpe .badge-s{display:inline-block;background:var(--soft);color:var(--ink);border-radius:8px;padding:2px 10px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.sinpe p{margin:0;color:var(--muted)}
.sinpe .who2{color:var(--ink);font-weight:700}

.bsearch{display:flex;gap:8px}
.bsearch input{flex:1;min-width:0}
.testament{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:6px 0 -6px}
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.books button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 12px;text-align:left;font-weight:700;font-size:14px;cursor:pointer}
.books button:hover{border-color:var(--accent)}
.chapters{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px}
.chapters a{display:grid;place-items:center;aspect-ratio:1;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;font-weight:800;text-decoration:none;font-variant-numeric:tabular-nums}
.chapters a:hover{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.note{font-size:13px;color:var(--muted);margin:0}

.prayer{display:grid;grid-template-columns:1fr 1.2fr;gap:24px;align-items:start}
@media (max-width:820px){.prayer{grid-template-columns:1fr}}
.prayer .intro{display:grid;gap:12px}
.prayer .intro p{margin:0;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 30px -18px color-mix(in srgb,var(--accent) 45%,transparent);padding:26px 22px;min-width:0}
form{display:grid;gap:20px}
.field{display:grid;gap:8px}
.label{font-weight:700;font-size:14px}
.hint{font-size:13px;color:var(--muted);margin:0}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:5px}
.seg input,.chips input{position:absolute;opacity:0;pointer-events:none}
.seg label{display:grid;gap:2px;text-align:center;padding:10px 8px;border-radius:10px;cursor:pointer;color:var(--muted)}
.seg label span{font-size:12px}
.seg input:checked+label{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px color-mix(in srgb,var(--ink) 14%,transparent)}
.seg input:focus-visible+label,.chips input:focus-visible+label{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:14px;cursor:pointer;color:var(--muted);background:var(--surface)}
.chips input:checked+label{background:var(--soft);border-color:var(--accent);color:var(--ink);font-weight:700}
input[type=text],input[type=url],input[type=date],input[type=time],input[type=password],input[type=search],textarea{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
textarea{min-height:130px;resize:vertical}
input:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.count{font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.err{color:var(--danger);font-size:14px;margin:0}
.privacy{font-size:13px;color:var(--muted);text-align:center;margin:-6px 0 0}
.done{text-align:center;display:grid;gap:14px;justify-items:center}
.ring{width:64px;height:64px;border-radius:50%;background:var(--soft);display:grid;place-items:center}
.done h3{margin:0;font-family:var(--font-display);font-size:24px;font-weight:800}
.done p{margin:0;color:var(--muted);max-width:42ch}
.palabra{background:var(--soft);border-radius:14px;padding:14px 16px;font-style:italic;color:var(--ink);max-width:44ch}
.palabra small{display:block;font-style:normal;font-weight:800;font-size:12px;letter-spacing:.06em;color:var(--muted);margin-top:6px;text-transform:uppercase}

footer{border-top:1px solid var(--line);padding-block:28px;text-align:center;color:var(--muted);font-size:14px}
footer .wrap{display:grid;gap:8px;justify-items:center}
.adminlink{border:0;background:transparent;color:var(--muted);font-size:13px;cursor:pointer;text-decoration:underline}

.adminbar{position:sticky;top:0;z-index:25;background:var(--hero1);color:#fff;padding-top:env(safe-area-inset-top,0px)}
.adminbar .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.adminbar b{font-family:var(--font-display);font-weight:800}
.adminbar .btn{background:rgba(255,255,255,.15);color:#fff}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{font-size:14px;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:7px 14px;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.req{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:8px;min-width:0}
.req.prayed{opacity:.65}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.who{font-weight:800;color:var(--ink);font-size:15px}
.tag{background:var(--soft);color:var(--ink);border-radius:999px;padding:1px 10px;font-size:12px}
.req p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.aviso{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;background:var(--soft);border:1px solid var(--accent);border-radius:16px;padding:14px 16px}
.aviso.suave{border-color:var(--line);background:var(--surface)}
.aviso-ic{font-size:26px}
.aviso b{display:block;font-size:16px}
.aviso span{color:var(--muted);font-size:14px}
@media (max-width:520px){.aviso{grid-template-columns:auto 1fr}.aviso .btn{grid-column:1/-1}}
.tag.nueva{background:var(--live);color:#fff;font-weight:800}
.bandejas button{font-size:15px;padding:9px 16px}
.badge{background:var(--live);color:#fff;border-radius:999px;padding:0 8px;font-size:12px;margin-left:6px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:grid;gap:16px}
.panel h3{margin:0;font-size:19px;font-weight:800}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.row2{grid-template-columns:1fr}}
.check{display:flex;gap:10px;align-items:center;font-weight:700}
.check input{width:20px;height:20px;accent-color:var(--live)}
.head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}

.modal{position:fixed;inset:0;z-index:50;background:var(--shade);display:grid;place-items:center;padding:16px}
.sheet{background:var(--surface);border-radius:18px;width:100%;max-width:520px;max-height:100%;overflow:auto;padding:22px;display:grid;gap:16px}
.sheet h3{margin:0;font-family:var(--font-display);font-size:24px;font-weight:800}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.confirm{background:var(--bg);border-radius:12px;padding:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumbs div{position:relative;width:84px;height:84px;border-radius:10px;overflow:hidden;background:var(--bg)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.thumbs button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:var(--shade);color:#fff;cursor:pointer}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:80;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;max-width:calc(100% - 32px)}
.lb{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.92);display:grid;place-items:center;padding:16px}
.lb img{max-width:100%;max-height:calc(100vh - 120px);object-fit:contain;border-radius:8px}
.lb .x{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px;background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:999px;padding:8px 14px;font-weight:800;cursor:pointer}
.lb .nv{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:50%;width:44px;height:44px;font-size:22px;cursor:pointer}
.lb .prev{left:12px}.lb .next{right:12px}

.install{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:45;max-width:520px;margin:0 auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:18px;box-shadow:0 16px 40px -12px var(--shade);padding:14px;display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;animation:up .35s ease-out}
@keyframes up{from{transform:translateY(20px);opacity:0}}
.install img{width:52px;height:52px;border-radius:12px}
.install b{display:block;font-size:15px}
.install p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.install .tools{grid-column:1/-1;justify-content:flex-end}

<script>
/* Aviso para instalar la app en el celular */
(function(){
  if ("serviceWorker" in navigator) window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
  var KEY = "instalar-oculto-hasta", deferred = null;
  function standalone(){ return matchMedia("(display-mode: standalone)").matches || navigator.standalone === true; }
  function snoozed(){ try { return Date.now() < +(localStorage.getItem(KEY) || 0); } catch(e){ return false; } }
  function snooze(days){ try { localStorage.setItem(KEY, String(Date.now() + days*864e5)); } catch(e){} }
  function banner(ios){
    if (document.getElementById("install") || standalone() || snoozed()) return;
    var d = document.createElement("div"); d.className = "install"; d.id = "install"; d.setAttribute("role","dialog"); d.setAttribute("aria-label","Instalar la app");
    d.innerHTML = '<img src="icon-192.png" alt=""><div><b>Instala la app de la iglesia</b><p>' +
      (ios ? 'Toca <b style="display:inline">Compartir</b> <span aria-hidden="true">⬆︎</span> y luego <b style="display:inline">“Agregar a inicio”</b>.' : 'Ten el ícono en tu pantalla y entra con un toque.') +
      '</p></div><div class="tools"><button class="btn ghost small" data-no>Ahora no</button>' + (ios ? '<button class="btn small" data-ok-ios>Entendido</button>' : '<button class="btn small" data-yes>Instalar</button>') + '</div>';
    document.body.appendChild(d);
    d.addEventListener("click", function(e){
      if (e.target.closest("[data-no]")) { snooze(7); d.remove(); }
      if (e.target.closest("[data-ok-ios]")) { snooze(30); d.remove(); }
      if (e.target.closest("[data-yes]") && deferred) {
        deferred.prompt();
        deferred.userChoice.then(function(c){ if (c.outcome !== "accepted") snooze(7); deferred = null; d.remove(); });
      }
    });
  }
  window.addEventListener("beforeinstallprompt", function(e){ e.preventDefault(); deferred = e; setTimeout(function(){ banner(false); }, 2500); });
  window.addEventListener("appinstalled", function(){ var d = document.getElementById("install"); if (d) d.remove(); snooze(3650); });
  var ua = navigator.userAgent, ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  if (ios && /Safari/.test(ua) && !/CriOS|FxiOS|EdgiOS/.test(ua)) window.addEventListener("load", function(){ setTimeout(function(){ banner(true); }, 3000); });
})();
</script>

const urlSitio = () => location.origin + location.pathname;
const pad2 = n => String(n).padStart(2,"0");
function fechaInicio(e){
  const base = e.repite === "semanal" ? proxima(e) : e.fecha;
  const [y,mo,d] = base.split("-").map(Number);
  const [h,mi] = (e.hora || "00:00").split(":").map(Number);
  return new Date(y, mo-1, d, h, mi);
}
const calStamp = d => `${d.getFullYear()}${pad2(d.getMonth()+1)}${pad2(d.getDate())}T${pad2(d.getHours())}${pad2(d.getMinutes())}00`;
const utc = d => d.toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,"");
const calDia = d => `${d.getFullYear()}${pad2(d.getMonth()+1)}${pad2(d.getDate())}`;
function agregarCalendario(e){
  const ini = fechaInicio(e), fin = new Date(+ini + 2*3600e3);
  const conHora = !!e.hora;
  const nombre = D.cfg.iglesia || DEFAULT.iglesia;
  const detalles = [e.desc, `${nombre} · ${urlSitio()}`].filter(Boolean).join("\n\n");
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
  if (ios) {
    const escIcs = t => String(t||"").replace(/[\\;,]/g, m => "\\" + m).replace(/\n/g, "\\n");
    const finDia = new Date(ini); finDia.setDate(finDia.getDate()+1);
    const ics = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Iglesia Jesus es el Rey//ES","BEGIN:VEVENT",
      `UID:${e.id}@iglesiajesuseselrey`, `DTSTAMP:${calStamp(new Date())}`,
      conHora ? `DTSTART:${utc(ini)}` : `DTSTART;VALUE=DATE:${calDia(ini)}`,
      conHora ? `DTEND:${utc(fin)}` : `DTEND;VALUE=DATE:${calDia(finDia)}`,
      ...(e.repite === "semanal" ? ["RRULE:FREQ=WEEKLY"] : []),
      `SUMMARY:${escIcs(e.titulo)}`, `LOCATION:${escIcs(e.lugar)}`, `DESCRIPTION:${escIcs(detalles)}`,
      "BEGIN:VALARM","TRIGGER:-PT1H","ACTION:DISPLAY",`DESCRIPTION:${escIcs(e.titulo)}`,"END:VALARM",
      "END:VEVENT","END:VCALENDAR"].join("\r\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([ics], {type:"text/calendar"}));
    a.download = (e.titulo || "evento").replace(/[^\wáéíóúñ ]+/gi,"").trim().replace(/\s+/g,"-") + ".ics";
    document.body.append(a); a.click(); a.remove();
    return;
  }
  const finDia = new Date(ini); finDia.setDate(finDia.getDate()+1);
  const q = new URLSearchParams({ action:"TEMPLATE", text:e.titulo, details:detalles, location:e.lugar || "", ctz:"America/Costa_Rica",

let drawerEl = null;
const PANELES = {menu:"Menú", fotos:"Fotos y noticias", videos:"Videos", biblia:"Biblia NTV", sinpe:"SINPE Móvil", gracias:"Agradecimientos", encuesta:"Encuesta", buzon:"Recomendaciones"};
function openPanel(name, fromHistory){
  if (!PANELES[name]) return;
  const reuse = drawerEl && !drawerEl.closing;
  let bg, d;
  if (reuse) { ({bg, d} = drawerEl); }
  else {
    bg = document.createElement("div"); bg.className = "drawer-bg";
    d = document.createElement("aside"); d.className = "drawer"; d.setAttribute("role","dialog"); d.setAttribute("aria-modal","true");
    document.body.append(bg, d); document.body.classList.add("locked");
    drawerEl = {bg, d};
    requestAnimationFrame(() => requestAnimationFrame(() => { bg.classList.add("open"); d.classList.add("open"); }));
    bg.addEventListener("click", closeAll);
  }
  d.classList.toggle("menu", name === "menu");
  d.setAttribute("aria-label", PANELES[name]);
  const sub = name !== "menu";
  d.innerHTML = `<header>${sub?`<button data-back-menu aria-label="Volver al menú">‹ Menú</button>`:""}<h2>${PANELES[name]}</h2><button data-close-panel>Cerrar ✕</button></header><div class="body" id="pbody"></div>`;
  $("[data-close-panel]", d).addEventListener("click", closeAll);
  if (sub) $("[data-back-menu]", d).addEventListener("click", () => { if (history.state?.panel && history.state.depth === 2) history.back(); else openPanel("menu"); });
  if (!fromHistory) {
    const depth = (history.state?.panel && name !== "menu") ? 2 : 1;
    if (history.state?.panel && name === "menu") history.replaceState({panel:"menu", depth:1}, "", "#menu");
    else history.pushState({panel:name, depth}, "", "#"+name);
  }
  const body = $("#pbody", d);
  if (name === "menu") {
    const s = D.cfg.sinpe || {};
    body.innerHTML = `<div class="menulist">
      <button data-panel="fotos"><span class="ic">${ICON.foto}</span><span><b>Fotos y noticias</b><small>${D.noticias.length ? `${D.noticias.length} ${D.noticias.length===1?"publicación":"publicaciones"}` : "Nuestras actividades"}</small></span><span class="arr">›</span></button>
      <button data-panel="videos"><span class="ic">${ICON.video}</span><span><b>Videos</b><small>${D.videos.length ? `${D.videos.length} ${D.videos.length===1?"video":"videos"}` : "Prédicas y alabanzas"}</small></span><span class="arr">›</span></button>
      <button data-panel="biblia"><span class="ic">${ICON.biblia}</span><span><b>Biblia NTV</b><small>Nueva Traducción Viviente</small></span><span class="arr">›</span></button>
      ${s.numero?`<button data-panel="sinpe"><span class="ic">${ICON.sinpe}</span><span><b>SINPE Móvil</b><small>Ofrendas y diezmos</small></span><span class="arr">›</span></button>`:""}
      <button data-panel="gracias"><span class="ic">${ICON.gracias}</span><span><b>Da gracias</b><small>Se mostrará el domingo</small></span><span class="arr">›</span></button>
      ${(D.encuestas||[]).some(e=>e.activa)?`<button data-panel="encuesta"><span class="ic">${ICON.encuesta}</span><span><b>Encuesta</b><small>Ayúdanos a planear actividades</small></span><span class="arr">›</span></button>`:""}
      <button data-panel="buzon"><span class="ic">${ICON.buzon}</span><span><b>Buzón de recomendaciones</b><small>Anónimo</small></span><span class="arr">›</span></button>
      <button data-act="login"><span class="ic">${ICON.llave}</span><span><b>Administración</b><small>Solo para pastores y equipo</small></span><span class="arr">›</span></button>
    </div>`;
  } else if (name === "sinpe") {
    body.innerHTML = sinpeHTML();
  } else if (name === "gracias") {
    renderAgradecer(body);
  } else if (name === "encuesta") {
    renderEncuesta(body);
  } else if (name === "buzon") {
    renderSugerencias(body);
  } else if (name === "fotos") {
    const list = [...D.noticias].sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||""));
    body.innerHTML = list.length ? `<div class="cards">${list.map(n=>nHTML(n)).join("")}</div>` : `<div class="empty">Pronto compartiremos fotos y noticias de nuestras actividades.</div>`;
    fillPhotos(body);
  } else if (name === "videos") {
    const list = [...D.videos].sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||""));
    body.innerHTML = list.length ? `<div class="cards">${list.map(v=>vHTML(v)).join("")}</div>` : `<div class="empty">Pronto compartiremos prédicas y alabanzas.</div>`;
  } else {
    renderBiblia(body);
  }
  $("[data-close-panel]", d).focus();
}
function closePanel(instant){
  if (!drawerEl) return;
  const {bg, d} = drawerEl; drawerEl = null;
  bg.classList.remove("open"); d.classList.remove("open");
  document.body.classList.remove("locked");
  setTimeout(() => { bg.remove(); d.remove(); }, instant ? 0 : 280);
}
function closeAll(){
  const depth = history.state?.panel ? (history.state.depth || 1) : 0;
  if (depth) history.go(-depth); else closePanel();
}
window.addEventListener("popstate", e => {
  const p = e.state?.panel;
  if (p) openPanel(p, true); else closePanel();
});

function modal(html, onReady){
  const m = document.createElement("div"); m.className = "modal";
  m.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  document.body.append(m); document.body.classList.add("locked");
  const close = () => { m.remove(); if (!drawerEl) document.body.classList.remove("locked"); };
  m.addEventListener("click", e => { if (e.target===m || e.target.closest("[data-close]")) close(); });
  onReady && onReady(m, close);
  const first = m.querySelector("input,textarea"); if (first) first.focus();
  return close;
}
const authMsg = code => ({
  "auth/invalid-credential":"Usuario o contraseña incorrectos.",
  "auth/wrong-password":"Usuario o contraseña incorrectos.",
  "auth/user-not-found":"Usuario o contraseña incorrectos.",
  "auth/too-many-requests":"Demasiados intentos. Espera unos minutos.",
  "auth/email-already-in-use":"Ese usuario ya tiene contraseña. Ingresa con ella.",

function loginModal(first=false){
  modal(`<h3>${first?"Crear contraseña":"Acceso de administración"}</h3>
    ${first?`<p class="hint">Se hace una sola vez por usuario. Usuarios: <b>admin</b>, <b>pastores</b>, <b>matrimonios</b>, <b>jovenes</b>, <b>varones</b> o <b>ninos</b>. Elige una contraseña de al menos 8 caracteres.</p>`:""}
    <form id="lf" novalidate style="gap:14px">

      <div class="actions" style="justify-content:space-between">

    });

/* ---------- Excel de peticiones (.xlsx hecho a mano, sin librerías) ---------- */
const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(b){ let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function zipStore(files){
  const enc = new TextEncoder(), parts = [], central = []; let off = 0;
  for (const [name, text] of files) {
    const nb = enc.encode(name), data = enc.encode(text), crc = crc32(data);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint16(6,0x0800,true); h.setUint16(8,0,true);
    h.setUint32(14,crc,true); h.setUint32(18,data.length,true); h.setUint32(22,data.length,true); h.setUint16(26,nb.length,true);
    parts.push(new Uint8Array(h.buffer), nb, data);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true); c.setUint16(4,20,true); c.setUint16(6,20,true); c.setUint16(8,0x0800,true);
    c.setUint32(16,crc,true); c.setUint32(20,data.length,true); c.setUint32(24,data.length,true); c.setUint16(28,nb.length,true); c.setUint32(42,off,true);
    central.push(new Uint8Array(c.buffer), nb);
    off += 30 + nb.length + data.length;
  }
  const csize = central.reduce((s,x) => s + x.length, 0), e = new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true); e.setUint16(8,files.length,true); e.setUint16(10,files.length,true); e.setUint32(12,csize,true); e.setUint32(16,off,true);
  return new Blob([...parts, ...central, new Uint8Array(e.buffer)], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
}
function xlsx(nombreHoja, filas, anchos){
  const x = v => String(v ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, "");
  const col = i => String.fromCharCode(65 + i);
  const rows = filas.map((f,ri) => `<row r="${ri+1}">${f.map((v,ci) => `<c r="${col(ci)}${ri+1}" t="inlineStr"${ri===0?' s="1"':' s="2"'}><is><t xml:space="preserve">${x(v)}</t></is></c>`).join("")}</row>`).join("");
  const sheet = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>${anchos.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join("")}</cols><sheetData>${rows}</sheetData><autoFilter ref="A1:${col(anchos.length-1)}${filas.length}"/></worksheet>`;
  const styles = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF2C20C4"/></patternFill></fill></fills><borders count="1"><border/></borders><cellStyleXfs count="1"><xf/></cellStyleXfs><cellXfs count="3"><xf/><xf fontId="1" fillId="2" applyFont="1" applyFill="1"/><xf applyAlignment="1"><alignment wrapText="1" vertical="top"/></xf></cellXfs></styleSheet>`;
  return zipStore([
    ["[Content_Types].xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`],
    ["_rels/.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`],
    ["xl/workbook.xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="${x(nombreHoja)}" sheetId="1" r:id="rId1"/></sheets></workbook>`],
    ["xl/_rels/workbook.xml.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`],
    ["xl/worksheets/sheet1.xml", sheet],
    ["xl/styles.xml", styles]
  ]);
}
function descargarExcel(){
  if (!reqs.length) return toast("Todavía no hay peticiones para descargar.");
  const B = BUZON[rol];
  const filas = [["Fecha", "Nombre", "Teléfono", "Para", "Motivo", "Petición", "Orado"]];
  reqs.forEach(r => {
    const f = new Date(msDe(r));
    filas.push([f.toLocaleString("es-CR", { year:"numeric", month:"2-digit", day:"2-digit", hour:"numeric", minute:"2-digit" }),
      r.anonimo ? "Anónimo" : (r.nombre || ""), r.contactar && r.telefono ? r.telefono : "", DESTINOS[destDe(r)] || "", r.tema || "", r.texto || "", r[B.campo] ? "Sí" : "No"]);
  });
  const blob = xlsx("Peticiones", filas, [20, 22, 14, 24, 18, 60, 8]);
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = `peticiones-${hoyISO()}.xlsx`; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast("Excel descargado");
}
async function avisar(r){
  const titulo = "Nueva petición de oración";
  const cuerpo = `${r.anonimo ? "Alguien" : (r.nombre || "Alguien")} quiere que ores por ${r.tema ? r.tema.toLowerCase() : "su petición"}.`;
  toast("🙏 " + cuerpo, 5000);
  try { navigator.vibrate?.([200, 100, 200]); } catch {}
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  try {
    const reg = await navigator.serviceWorker?.getRegistration?.();
    if (reg) await reg.showNotification(titulo, { body: cuerpo, icon: "icon-192.png", badge: "icon-192.png", tag: "peticion-" + r.id });
    else new Notification(titulo, { body: cuerpo, icon: "icon-192.png" });
  } catch { try { new Notification(titulo, { body: cuerpo, icon: "icon-192.png" }); } catch {} }
}
function actualizarInsignia(){
  const B = BUZON[rol]; if (!B) return;
  const n = reqs.filter(r => !r[B.campo] && (rol !== "pastores" || destDe(r) === "general")).length;
  try { n ? navigator.setAppBadge?.(n) : navigator.clearAppBadge?.(); } catch {}
  document.title = (n ? `(${n}) ` : "") + (D.cfg.iglesia || DEFAULT.iglesia);
}

async function compress(file){
  const bmp = await createImageBitmap(file);
  let max = 1280, q = 0.78, out = "";
  for (let i = 0; i < 4; i++) {
    const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width*k); c.height = Math.round(bmp.height*k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    out = c.toDataURL("image/jpeg", q);
    if (out.length < 700000) return out;
    max = Math.round(max*0.8); q -= 0.08;
  }
  return out.length < 900000 ? out : "";
}

async function lightbox(ids, i){
  const d = document.createElement("div"); d.className = "lb"; d.setAttribute("role","dialog"); d.setAttribute("aria-label","Foto");
  const show = async () => { d.innerHTML = `<img alt=""><button class="x">Cerrar ✕</button>${ids.length>1?`<button class="nv prev" aria-label="Anterior">‹</button><button class="nv next" aria-label="Siguiente">›</button>`:""}`; $("img",d).src = await foto(ids[i]); };
  document.body.append(d); show();
  const close = () => { d.remove(); document.removeEventListener("keydown", key); };
  const key = e => { if (e.key==="Escape") close(); if (e.key==="ArrowRight"){ i=(i+1)%ids.length; show(); } if (e.key==="ArrowLeft"){ i=(i-1+ids.length)%ids.length; show(); } };
  document.addEventListener("keydown", key);
  d.addEventListener("click", e => {
    if (e.target.closest(".next")) { i=(i+1)%ids.length; show(); }
    else if (e.target.closest(".prev")) { i=(i-1+ids.length)%ids.length; show(); }
    else if (e.target.closest(".x") || e.target===d) close();
  });
}

/* Semana de agradecimientos: domingo 11:00 a. m. → domingo siguiente 9:30 a. m. */
function semanaGracias(offset = 0){
  const now = new Date();
  const start = new Date(now); start.setHours(11, 0, 0, 0);
  start.setDate(start.getDate() - start.getDay());           // domingo de esta semana
  if (start > now) start.setDate(start.getDate() - 7);        // aún no son las 11 del domingo
  start.setDate(start.getDate() + 7 * offset);
  const end = new Date(start); end.setDate(end.getDate() + 7); end.setHours(9, 30, 0, 0);
  return { start, end };
}

/* ---------- Admin: agradecimientos e imagen para proyectar ---------- */
let agrSemana = 0, agrSel = null;
async function tabAgradecimientos(t){
  t.innerHTML = `<div class="empty">Cargando agradecimientos…</div>`;
  let lista = [];
  try { lista = (await getDocs(collection(fb, "agradecimientos"))).docs.map(d => ({ id: d.id, ...d.data() })); }
  catch (x) { console.error(x); t.innerHTML = `<div class="empty">No se pudieron cargar. Revisa las reglas de Firestore.</div>`; return; }
  const limite = +semanaGracias(-1).start;
  const viejos = lista.filter(r => msDoc(r) && msDoc(r) < limite);
  if (viejos.length) { await Promise.all(viejos.map(r => deleteDoc(doc(fb, "agradecimientos", r.id)).catch(() => {}))); lista = lista.filter(r => !viejos.includes(r)); }
  if (agrSemana < -1) agrSemana = -1;
  const { start, end } = semanaGracias(agrSemana);
  const semana = lista.filter(r => { const m = msDoc(r); return m >= +start && m < +end; }).sort((a,b) => msDoc(a) - msDoc(b));
  if (!agrSel) agrSel = new Set(semana.map(r => r.id));
  t.innerHTML = `<section>
    <div class="head"><div><h2>Agradecimientos</h2><p class="sub">Del domingo ${esc(fmtCorta(start))} (11:00 a. m.) al domingo ${esc(fmtCorta(end))} (9:30 a. m.) · ${semana.length} recibidos<br>Se guardan esta semana y la anterior. Las más viejas se borran solas.</p></div>
      <div class="tabs">${agrSemana===0?`<button data-agr="-1">‹ Semana anterior</button>`:`<button data-agr="1">Semana actual ›</button>`}</div></div>
    ${semana.length ? `<div class="actions" style="justify-content:flex-start"><button class="btn" id="agr-img">Crear imagen para proyectar</button><span class="sub" id="agr-cnt">${[...agrSel].filter(id=>semana.some(r=>r.id===id)).length} seleccionados</span></div>
      <div class="gracias-lista">${semana.map(r => `<label class="gcard"><input type="checkbox" data-gsel="${esc(r.id)}" ${agrSel.has(r.id)?"checked":""}><span><b>“${esc(r.texto)}”</b><small>${esc(r.nombre||"Sin nombre")} · ${esc(fmtHora(new Date(msDoc(r))))}</small></span><button type="button" class="btn small danger" data-gdel="${esc(r.id)}">Borrar</button></label>`).join("")}</div>`
      : `<div class="empty">No hay agradecimientos en esta semana.</div>`}
  </section>`;
  t.querySelectorAll("[data-agr]").forEach(b => b.addEventListener("click", () => { agrSemana += +b.dataset.agr; agrSel = null; tabAgradecimientos(t); }));
  t.querySelectorAll("[data-gsel]").forEach(c => c.addEventListener("change", () => { c.checked ? agrSel.add(c.dataset.gsel) : agrSel.delete(c.dataset.gsel); $("#agr-cnt", t).textContent = `${[...agrSel].filter(id=>semana.some(r=>r.id===id)).length} seleccionados`; }));
  t.querySelectorAll("[data-gdel]").forEach(b => b.addEventListener("click", async ev => {
    ev.preventDefault();
    if (b.dataset.sure !== "1") { b.dataset.sure = "1"; b.textContent = "¿Seguro?"; return; }
    try { await deleteDoc(doc(fb, "agradecimientos", b.dataset.gdel)); agrSel.delete(b.dataset.gdel); toast("Borrado"); tabAgradecimientos(t); } catch { toast("No se pudo borrar."); }
  }));
  $("#agr-img", t)?.addEventListener("click", async () => {
    const elegidos = semana.filter(r => agrSel.has(r.id));
    if (!elegidos.length) return toast("Selecciona al menos un agradecimiento.");
    const imgs = await imagenesGracias(elegidos, start, end);
    verImagenes(imgs, start);
  });
}

function cargarImg(src){ return new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = src; }); }
async function imagenesGracias(items, start, end){
  try { await document.fonts.load('800 60px "Archivo"'); await document.fonts.load('400 40px "Allura"'); await document.fonts.load('700 30px "Nunito Sans"'); } catch {}
  const logo = await cargarImg(LOGO);
  const POR = 12, paginas = [];
  for (let i = 0; i < items.length; i += POR) paginas.push(items.slice(i, i + POR));
  const urls = [];
  for (let p = 0; p < paginas.length; p++) {
    const W = 1920, H = 1080, c = document.createElement("canvas"); c.width = W; c.height = H;
    const x = c.getContext("2d");
    const g = x.createRadialGradient(W * .5, -200, 100, W * .5, 300, 1500); g.addColorStop(0, "#3326d6"); g.addColorStop(.55, "#1a1280"); g.addColorStop(1, "#0b0840");
    x.fillStyle = g; x.fillRect(0, 0, W, H);
    for (let k = 0; k < 90; k++) { x.fillStyle = `rgba(255,255,255,${.05 + Math.random()*.18})`; x.beginPath(); x.arc(Math.random()*W, Math.random()*H, 1 + Math.random()*2.4, 0, 7); x.fill(); }
    const lw = 190, lh = lw * logo.height / logo.width; x.drawImage(logo, 90, 58, lw, lh);
    x.fillStyle = "#fff"; x.textBaseline = "alphabetic";
    x.font = '900 86px "Archivo", "Arial Black", sans-serif'; x.fillText("¡Gracias, Señor!", 320, 132);
    x.font = '400 54px "Allura", cursive'; x.fillStyle = "#ffd68c"; x.fillText("Agradecimientos de nuestra iglesia", 324, 196);
    x.textAlign = "right"; x.font = '700 30px "Nunito Sans", sans-serif'; x.fillStyle = "rgba(255,255,255,.75)";
    x.fillText(`Semana del ${fmtCorta(start)} al ${fmtCorta(end)}`, W - 90, 120);
    if (paginas.length > 1) x.fillText(`${p + 1} de ${paginas.length}`, W - 90, 162);
    x.textAlign = "left";
    const lista = paginas[p], cols = 3, rows = Math.ceil(lista.length / cols);
    const top = 262, bottom = H - 96, gap = 26, cw = (W - 180 - gap * (cols - 1)) / cols;
    const ch = Math.min(170, (bottom - top - gap * (rows - 1)) / Math.max(rows, 1));
    const offY = top + ((bottom - top) - (rows * ch + (rows - 1) * gap)) / 2;
    lista.forEach((r, i) => {
      const cx = 90 + (i % cols) * (cw + gap), cy = offY + Math.floor(i / cols) * (ch + gap);
      x.fillStyle = "rgba(255,255,255,.10)"; x.strokeStyle = "rgba(255,255,255,.22)"; x.lineWidth = 2;
      x.beginPath(); x.roundRect(cx, cy, cw, ch, 26); x.fill(); x.stroke();
      x.fillStyle = "#ffd68c"; x.font = '900 70px "Archivo", sans-serif'; x.fillText("“", cx + 24, cy + 70);
      x.fillStyle = "#fff";
      const maxW = cw - 96, fnt = n => `800 ${n}px "Nunito Sans", sans-serif`;
      let fs = 40, lineas = [r.texto]; x.font = fnt(fs);
      while (x.measureText(r.texto).width > maxW && fs > 34) { fs -= 2; x.font = fnt(fs); }
      if (x.measureText(r.texto).width > maxW) {
        const partir = () => { const pal = r.texto.split(" "); const out = [""]; for (const w of pal) { const t = (out[out.length-1] + " " + w).trim(); if (x.measureText(t).width <= maxW || !out[out.length-1]) out[out.length-1] = t; else out.push(w); } return out; };
        fs = 34; x.font = fnt(fs); lineas = partir();
        while (lineas.length > 2 && fs > 24) { fs -= 2; x.font = fnt(fs); lineas = partir(); }
        if (lineas.length > 2) lineas = [lineas[0], lineas.slice(1).join(" ")];
      }
      const lh = fs * 1.18, bloque = lineas.length * lh + (r.nombre ? 40 : 0);
      let ty = cy + (ch - bloque) / 2 + fs * 0.9;
      lineas.forEach(l => { x.fillText(l, cx + 70, ty); ty += lh; });
      if (r.nombre) { x.font = '600 26px "Nunito Sans", sans-serif'; x.fillStyle = "rgba(255,255,255,.72)"; x.fillText("— " + r.nombre, cx + 70, ty + 8); }
    });
    x.font = '700 28px "Nunito Sans", sans-serif'; x.fillStyle = "rgba(255,255,255,.7)"; x.textAlign = "center";
    x.fillText("“Dad gracias en todo, porque esta es la voluntad de Dios.”  1 Tesalonicenses 5:18", W / 2, H - 46);
    urls.push(await new Promise(ok => c.toBlob(b => ok(URL.createObjectURL(b)), "image/png")));
  }
  return urls;
}
function verImagenes(urls, start){
  const nombre = i => `agradecimientos-${start.toISOString().slice(0,10)}${urls.length > 1 ? "-" + (i + 1) : ""}.png`;
  modal(`<h3>Imagen para proyectar</h3>
    <p class="hint">Descárgala para pasarla a la computadora del proyector, toca “Compartir” para enviarla a Facebook, Instagram o WhatsApp, o toca “Pantalla completa” para mostrarla desde este dispositivo.</p>
    <div style="display:grid;gap:14px">${urls.map((u,i)=>`<div style="display:grid;gap:8px"><img src="${u}" alt="Agradecimientos ${i+1}" style="width:100%;border-radius:12px;border:1px solid var(--line)">
      <div class="tools"><a class="btn small" href="${u}" download="${nombre(i)}">Descargar${urls.length>1?` ${i+1}`:""}</a><button type="button" class="btn small wa" data-share="${i}">Compartir</button><button type="button" class="btn small ghost" data-full="${i}">Pantalla completa</button></div></div>`).join("")}</div>
    <div class="actions"><button class="btn ghost" data-close>Cerrar</button></div>`, m => {
    m.querySelectorAll("[data-full]").forEach(b => b.addEventListener("click", () => proyectar(urls, +b.dataset.full)));
    m.querySelectorAll("[data-share]").forEach(b => b.addEventListener("click", async () => {
      const i = +b.dataset.share;
      try {
        const blob = await (await fetch(urls[i])).blob();
        const file = new File([blob], nombre(i), { type: "image/png" });
        const texto = `¡Gracias, Señor! Agradecimientos de nuestra iglesia 🙏 · ${D.cfg.iglesia || DEFAULT.iglesia}`;
        if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: "Agradecimientos", text: texto }); }
        else toast("Este dispositivo no permite compartir imágenes directo. Toca “Descargar” y súbela a Facebook, Instagram o WhatsApp desde tu galería.", 6000);
      } catch (x) { if (x?.name !== "AbortError") toast("No se pudo compartir. Descárgala y compártela desde tu galería.", 5000); }
    }));
  });
}
function proyectar(urls, i){
  const d = document.createElement("div"); d.className = "lb"; d.style.background = "#000"; d.style.padding = "0";
  const show = () => d.innerHTML = `<img src="${urls[i]}" alt="" style="max-height:100vh;max-width:100vw;border-radius:0">${urls.length>1?`<button class="nv prev" aria-label="Anterior">‹</button><button class="nv next" aria-label="Siguiente">›</button>`:""}<button class="x">Salir ✕</button>`;
  show(); document.body.append(d);
  d.requestFullscreen?.().catch(() => {});
  const close = () => { try { document.fullscreenElement && document.exitFullscreen(); } catch {} d.remove(); document.removeEventListener("keydown", key); };
  const key = e => { if (e.key === "Escape") close(); if (e.key === "ArrowRight") { i = (i + 1) % urls.length; show(); } if (e.key === "ArrowLeft") { i = (i - 1 + urls.length) % urls.length; show(); } };
  document.addEventListener("keydown", key);
  d.addEventListener("click", e => { if (e.target.closest(".next")) { i = (i + 1) % urls.length; show(); } else if (e.target.closest(".prev")) { i = (i - 1 + urls.length) % urls.length; show(); } else if (e.target.closest(".x")) close(); });
}

/* ---------- Admin: encuestas ---------- */
async function tabEncuestas(t){
  t.innerHTML = `<div class="empty">Cargando encuestas…</div>`;
  let encs = [];
  try { encs = (await getDocs(collection(fb, "encuestas"))).docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => msDoc(b) - msDoc(a)); }
  catch (x) { console.error(x); t.innerHTML = `<div class="empty">No se pudieron cargar las encuestas.</div>`; return; }
  const votos = {};
  await Promise.all(encs.map(async e => {
    try { votos[e.id] = (await getDocs(collection(fb, "encuestas", e.id, "votos"))).docs.map(d => d.data().opcion); } catch { votos[e.id] = []; }
  }));
  t.innerHTML = `<section><div class="head"><div><h2>Encuestas</h2><p class="sub">La gente vota desde el menú. Solo se muestran las encuestas abiertas.</p></div><button class="btn" id="enc-new">+ Nueva encuesta</button></div>
    ${encs.length ? encs.map(e => { const v = votos[e.id] || [], tot = v.length; return `<div class="panel">
      <div class="head" style="align-items:center"><h3>${esc(e.pregunta)}</h3><span class="tag" style="${e.activa?"background:var(--ok);color:#fff":""}">${e.activa?"Abierta":"Cerrada"}</span></div>
      <div style="display:grid;gap:10px">${(e.opciones||[]).map((o,i) => { const n = v.filter(x => x === i).length, pc = tot ? Math.round(n * 100 / tot) : 0; return `<div class="barra"><div class="barra-t"><span>${esc(o)}</span><b>${n} · ${pc}%</b></div><div class="barra-f"><i style="width:${pc}%"></i></div></div>`; }).join("")}</div>
      <p class="sub" style="margin:0">${tot} ${tot===1?"voto":"votos"} en total</p>
      <div class="tools"><button class="btn small" data-etog="${esc(e.id)}">${e.activa?"Cerrar encuesta":"Abrir encuesta"}</button><button class="btn small danger" data-edel="${esc(e.id)}">Borrar</button></div></div>`; }).join("")
    : `<div class="empty">No hay encuestas. Toca “+ Nueva encuesta”.</div>`}</section>`;
  $("#enc-new", t).addEventListener("click", () => modal(`<h3>Nueva encuesta</h3>
      <div class="field"><label class="label" for="q-p">Pregunta</label><input type="text" id="q-p" maxlength="120" placeholder="Ej.: ¿Qué actividad te gustaría para noviembre?"></div>
      <div class="field"><label class="label" for="q-o">Opciones (una por línea)</label><textarea id="q-o" placeholder="Campamento familiar&#10;Noche de alabanza&#10;Paseo a la playa"></textarea><p class="hint">Entre 2 y 8 opciones.</p></div>
      <p class="err" id="q-err" hidden></p>
      <div class="actions"><button class="btn ghost" data-close>Cancelar</button><button class="btn" id="q-save">Publicar encuesta</button></div>`, (m, close) => {
      $("#q-save", m).addEventListener("click", async () => {
        const p = $("#q-p", m).value.trim(), ops = $("#q-o", m).value.split("\n").map(s => s.trim()).filter(Boolean).slice(0, 8);
        const err = s => { const e = $("#q-err", m); e.textContent = s; e.hidden = !s; };
        if (!p) return err("Escribe la pregunta."); if (ops.length < 2) return err("Escribe al menos 2 opciones.");
        try { await addDoc(collection(fb, "encuestas"), { pregunta: p, opciones: ops, activa: true, fecha: serverTimestamp() }); close(); toast("Encuesta publicada"); await loadPublic(); tabEncuestas(t); }
        catch (x) { console.error(x); err("No se pudo guardar."); }
      });
    }));
  t.querySelectorAll("[data-etog]").forEach(b => b.addEventListener("click", async () => {
    const e = encs.find(x => x.id === b.dataset.etog);
    try { await updateDoc(doc(fb, "encuestas", e.id), { activa: !e.activa }); toast(e.activa ? "Encuesta cerrada" : "Encuesta abierta"); await loadPublic(); tabEncuestas(t); } catch { toast("No se pudo cambiar."); }
  }));
  t.querySelectorAll("[data-edel]").forEach(b => b.addEventListener("click", async () => {
    if (b.dataset.sure !== "1") { b.dataset.sure = "1"; b.textContent = "¿Seguro? Toca otra vez"; return; }
    try { await deleteDoc(doc(fb, "encuestas", b.dataset.edel)); toast("Encuesta borrada"); await loadPublic(); tabEncuestas(t); } catch { toast("No se pudo borrar."); }
  }));
}

/* ---------- Admin y Pastores: recomendaciones ---------- */
async function tabRecomendaciones(t){
  t.innerHTML = `<div class="empty">Cargando recomendaciones…</div>`;
  let lista = [];
  try { lista = (await getDocs(collection(fb, "recomendaciones"))).docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => msDoc(b) - msDoc(a)); }
  catch (x) { console.error(x); t.innerHTML = `<div class="empty">No se pudieron cargar. Revisa las reglas de Firestore.</div>`; return; }
  t.innerHTML = `<section><div><h2>Buzón de recomendaciones</h2><p class="sub">Son anónimas. Las ven la administración y los Pastores.</p></div>
    ${lista.length ? lista.map(r => `<article class="req"><div class="meta"><span class="who">Anónimo</span><span>${esc(fmtHora(new Date(msDoc(r))))}</span></div><p>${esc(r.texto)}</p>
      <div class="tools" style="justify-content:flex-end"><button class="btn small danger" data-sdel="${esc(r.id)}">Borrar</button></div></article>`).join("")
    : `<div class="empty">Todavía no han llegado recomendaciones.</div>`}</section>`;
  t.querySelectorAll("[data-sdel]").forEach(b => b.addEventListener("click", async () => {
    if (b.dataset.sure !== "1") { b.dataset.sure = "1"; b.textContent = "¿Seguro? Toca otra vez"; return; }
    try { await deleteDoc(doc(fb, "recomendaciones", b.dataset.sdel)); toast("Borrada"); tabRecomendaciones(t); } catch { toast("No se pudo borrar."); }
  }));
}

/* ---------------- Clics ---------------- */
document.addEventListener("keydown", e => { if (e.key === "Escape" && drawerEl && !document.querySelector(".modal,.lb")) closeAll(); });
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act],[data-copy],[data-lb],[data-tab],[data-rf],[data-pray],[data-delreq],[data-panel],[data-goto],[data-rdest],[data-pvista],[data-cal]"); if (!el) return;
  if (el.dataset.panel) { openPanel(el.dataset.panel); return; }
  if (el.dataset.cal) { const ev = D.eventos.find(x => x.id === el.dataset.cal); if (ev) agregarCalendario(ev); return; }
  if (el.dataset.goto) { const id = el.dataset.goto; closeAll(); setTimeout(() => document.getElementById(id)?.scrollIntoView({behavior:"smooth"}), 320); return; }
  if (el.dataset.copy !== undefined) { const old = el.textContent; try { await navigator.clipboard.writeText(el.dataset.copy); el.textContent = "Copiado ✓"; } catch { el.textContent = "Cópialo a mano"; } setTimeout(()=>el.textContent=old, 2000); return; }
  if (el.dataset.lb) { const n = D.noticias.find(x=>x.id===el.dataset.lb); if (n) lightbox(n.fotos, +el.dataset.i); return; }
  if (el.dataset.tab) { adminTab = el.dataset.tab; renderAdmin(); return; }
  if (el.dataset.rf) { rfilter = el.dataset.rf; renderPastor(); return; }
  if (el.dataset.rdest) { rdest = el.dataset.rdest; renderPastor(); return; }
  if (el.dataset.pvista) { pastorVista = el.dataset.pvista; renderPastor(); return; }
  if (el.dataset.pray) { const r = reqs.find(x=>x.id===el.dataset.pray); if (!r) return; el.disabled = true; const campo = BUZON[rol]?.campo; if (!campo) return; try { await updateDoc(doc(fb,"peticiones",r.id), {[campo]:!r[campo]}); } catch { toast("No se pudo actualizar."); el.disabled = false; } return; }
  if (el.dataset.delreq) {
    if (el.dataset.sure !== "1") { el.dataset.sure = "1"; el.textContent = "¿Seguro? Toca otra vez"; setTimeout(()=>{ if (el.isConnected){ el.dataset.sure=""; el.textContent="Borrar"; } }, 4000); return; }
    try { await deleteDoc(doc(fb,"peticiones",el.dataset.delreq)); toast("Petición borrada"); } catch { toast("No se pudo borrar."); }
    return;
  }
  const a = el.dataset.act;
  if (a==="login") { if (drawerEl) closeAll(); if (rol) { view = rol; rol==="admin" ? renderAdmin() : renderPastor(); window.scrollTo(0,0); } else setTimeout(() => loginModal(false), drawerEl ? 300 : 0); return; }
  if (a==="logout") { if (BUZON[rol]) guardarVisto(Date.now()); try { navigator.clearAppBadge?.(); } catch {} await signOut(auth); return; }
  if (a==="ver-sitio") { view = "public"; await loadPublic(); renderPublic(); window.scrollTo(0,0); return; }
  if (a==="otra") return renderPrayerForm(false);
  if (a==="excel") return descargarExcel();
  if (a==="aviso-ok") { avisoCerrado = true; guardarVisto(Date.now()); renderPastor(); return; }
  if (a==="activar-avisos") { try { const p = await Notification.requestPermission(); toast(p === "granted" ? "Avisos activados" : "No se activaron los avisos. Puedes activarlos en los permisos del sitio."); } catch { toast("Este navegador no permite avisos."); } renderPastor(); return; }
  if (a==="ev-new") return formEvento();
  if (a==="ev-edit") return formEvento(D.eventos.find(x=>x.id===el.dataset.id));
  if (a==="no-new") return formNoticia();
  if (a==="no-edit") return formNoticia(D.noticias.find(x=>x.id===el.dataset.id));
  if (a==="vi-new") return formVideo();
  if (a==="vi-edit") return formVideo(D.videos.find(x=>x.id===el.dataset.id));
});

/* ---------------- Inicio ---------------- */
renderPublic();
await loadPublic();
renderPublic();
const startPanel = location.hash.slice(1);
if (Object.keys(PANELES).includes(startPanel)) { history.replaceState(null, "", location.pathname); openPanel(startPanel); }
if (startPanel === "admin") loginModal(false);
onAuthStateChanged(auth, user => {
  const email = (user?.email || "").toLowerCase();
  rol = Object.values(USUARIOS).find(u => u.email === email)?.rol || null;
  if (unsubReqs) { unsubReqs(); unsubReqs = null; }
  if (user && !rol) { signOut(auth); return; }
  if (BUZON[rol]) {
    const B = BUZON[rol];
    view = rol; reqs = []; rdest = "general"; pastorVista = "pet"; avisoCerrado = false; primeraCarga = true;
    vistoAntes = leerVisto();
    renderPastor();
    const q = B.filtro ? query(collection(fb,"peticiones"), where("destino","==",B.filtro)) : collection(fb,"peticiones");
    unsubReqs = onSnapshot(q,
      snap => {
        if (!primeraCarga) snap.docChanges().filter(c => c.type === "added").forEach(c => avisar({id:c.doc.id, ...c.doc.data()}));
        reqs = snap.docs.map(d => ({id:d.id, ...d.data()})).sort((a,b) => msDe(b) - msDe(a));
        if (primeraCarga && !vistoAntes) { vistoAntes = Date.now(); guardarVisto(vistoAntes); avisoCerrado = true; }
        primeraCarga = false;
        actualizarInsignia();
        if (view===rol) renderPastor();
      },
      err => { console.error(err); toast("No tienes permiso para ver las peticiones. Revisa las reglas de Firestore."); });
  } else if (rol === "admin") {
    view = "admin"; renderAdmin();
  } else if (view !== "public") {
    view = "public"; renderPublic();
  }
});
